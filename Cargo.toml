[package]
name = "openwrtfi"
version = "0.1.0"
edition = "2024"
description = "UniFi-style dashboard for OpenWrt, small enough to run on the router"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-util", "net", "time", "process", "fs", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", default-features = false }
mime_guess = { version = "2", default-features = false }
argh = "0.1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
futures-util = { version = "0.3", default-features = false }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
# Already pulled in transitively by axum's "ws" feature (server-side upgrade); declared directly
# too so `src/shell.rs` can use it as a WebSocket *client* to proxy to ttyd. No TLS features.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[dev-dependencies]
# Already in the dependency graph via axum itself; used here only to drive the router directly
# (`oneshot`) in `src/api.rs`'s integration tests, so it never touches the release binary.
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
