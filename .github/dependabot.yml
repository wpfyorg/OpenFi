version: 2
multi-ecosystem-groups:
  routine:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: routine
  - package-ecosystem: npm
    directory: /web
    patterns:
      - "*"
    multi-ecosystem-group: routine
    ignore:
      - dependency-name: preact
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: routine
