name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user need or limitation motivates this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how a user would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: luci_workflow
    attributes:
      label: LuCI workflow and acceptance criteria
      description: If requesting parity, identify the LuCI version/package/page and expected behavior. Include validation, permissions, safe apply, rollback and recovery where relevant.
    validations:
      required: false
