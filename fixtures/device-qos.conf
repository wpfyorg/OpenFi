# /etc/device-qos.conf - per-device download burst tiers + monthly FUP governor
# Consumed by /usr/sbin/qos-tiers. Values are kbit/s unless noted.

# Interfaces
WAN=wan
IFB=ifb4qos

# Shaper targets. Set each just below the real link rate so cake is the bottleneck; this is
# what prevents bufferbloat. 0 = unlimited (no cap that direction - cake still flow-queues but
# does not pace, so the ISP's buffers take over and latency under load returns).
DL_CEIL=0               # 0 = no download cap (cake unlimited on ifb4qos)
UL_CEIL=0               # 0 = no upload cap (cake unlimited on wan)

# Per-device download burst tiers (NOT global caps - each device gets its own ceiling)
BURST_T1_BYTES=500000000   # first 500 MB
BURST_T2_BYTES=1000000000  # 500 MB - 1 GB
BURST_T1_RATE=250000       # 250 Mbps
BURST_T2_RATE=125000       # 125 Mbps
BURST_T3_RATE=62500        # 62.5 Mbps (exact)

# Burst usage / idle-credit engine (download only)
BULK_MIN_KBIT=20000     # >=20 Mbps burns the allowance
IDLE_MAX_KBIT=10000     # <10 Mbps is an idle candidate
IDLE_RESET_KBIT=12000   # >=12 Mbps resets idle timer (10-12 = hysteresis hold)
IDLE_HOLD_SEC=60        # hold <10 Mbps this long before earning credit
CREDIT_BPS=416666       # ~25 MB/min => 500 MB per 20 min of qualifying idle
CREDIT_MAX_BYTES=500000000  # max 500 MB recovered credit

# Monthly FUP tiers (long-term caps; burst tier still applies below them via min()).
# Below 50 GB: unrestricted (no monthly cap). Whitelisted devices skip monthly caps entirely.
FUP_GB_1=50
FUP_GB_2=100
FUP_GB_3=200
FUP_RATE_50=125000          # 50-100 GB -> 125 Mbit
FUP_RATE_100=62500          # 100-200 GB -> 62.5 Mbit (exact)
FUP_RATE_200=50000          # 200 GB+ -> 50 Mbit

# Housekeeping
TICK=5
LAN_NET=192.0.2.13/24
